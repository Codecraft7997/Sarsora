<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>حاجات حبيتها فيكي ♡</title>

<style>
:root {
  --gold: #e8d2a0;
  --cream: #fff8ed;
  --muted: #d9d1c5;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: Tahoma, Arial, sans-serif;
  background: #101827;
}
.bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: url("PUT-YOUR-BACKGROUND-IMAGE-URL-HERE") center/cover no-repeat;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(8, 16, 31, .86);
}
main {
  width: min(92%, 850px);
  margin: auto;
  padding: 25px 0 40px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
}
.logo { color: var(--gold); font-weight: bold; }
.back { color: var(--gold); text-decoration: none; }

header {
  text-align: center;
  margin-bottom: 30px;
}
header .heart { font-size: 42px; }
h1 {
  color: var(--gold);
  font-size: clamp(27px, 6vw, 40px);
  margin: 12px 0;
}
header p {
  color: var(--muted);
  line-height: 1.9;
  margin: 0;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 145px), 1fr));
  gap: 14px;
}
.card {
  min-height: 150px;
  padding: 20px 12px;
  border: 1px solid #e8d2a055;
  border-radius: 22px;
  background: #111d30e8;
  box-shadow: 0 15px 40px #0003;
  cursor: pointer;
  text-align: center;
  color: var(--cream);
  font: inherit;
  transition: transform .2s, border-color .2s, background .2s;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  background: #18263be8;
}
.card .number {
  color: var(--gold);
  font-size: 13px;
  margin-bottom: 15px;
}
.card .lock {
  font-size: 34px;
  margin-bottom: 12px;
}
.card .hint {
  color: var(--muted);
  font-size: 13px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #050b14d9;
  backdrop-filter: blur(8px);
}
.overlay.show { display: flex; }
.modal {
  width: min(100%, 520px);
  padding: 30px 24px;
  text-align: center;
  border: 1px solid #e8d2a080;
  border-radius: 26px;
  background: #111d30;
  box-shadow: 0 25px 80px #0007;
  animation: appear .25s ease;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal .emoji { font-size: 42px; }
.modal h2 {
  color: var(--gold);
  font-size: 25px;
  margin: 14px 0;
}
.modal p {
  color: var(--cream);
  line-height: 2.1;
  font-size: 18px;
  margin: 0 0 22px;
  overflow-wrap: anywhere;
}
.close {
  padding: 12px 25px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #f5e7c5, #d4b77b);
  color: #172033;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding-top: 30px;
}
</style>
</head>

<body>
<div class="bg"></div>

<main>
  <div class="top">
    <span class="logo">♡ SOSO PROJECT</span>
    <a class="back" href="index.html">← الرئيسية</a>
  </div>

  <header>
    <div class="heart">🤍</div>
    <h1>حاجات حبيتها فيكي</h1>
    <p>فيه 12 حاجة مستخبية ليكي… افتحي كل كارت واكتشفي واحدة ♡</p>
  </header>

  <section class="cards" id="cards"></section>

  <footer>كل تفصيلة فيكي ليها مكان خاص عندي ♡</footer>
</main>

<div class="overlay" id="overlay" onclick="closeCard(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="emoji" id="modalEmoji">🤍</div>
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button class="close" onclick="hideCard()">اقفلي الكارت ♡</button>
  </div>
</div>

<script>
const reasons = [
  {
    title: "ضحكتك",
    emoji: "😊",
    text: "وربي ضحكتك حلوه اويي بتضحكي كده وانت جواكي ابيض ."
  },
  {
    title: "طيبة قلبك",
    emoji: "🤍",
    text: "بحب طيبة قلبك تحسي كده انك عامله فيها شرسه بس انت طيبه اوي وقلبكك نضيف وهطله ."
  },
  {
    title: "انك شايله مسئوليه",
    emoji: "🌷",
    text: "دي بجد بقي يمكن احلي حاجه فيكي بحبها اوي فيكي ."
  },
  {
    title: "طريقة كلامك",
    emoji: "💬",
    text: "بحب كلامك وطريقتك في الكلام بجد بحسك كده غلبانه اوي وسالكه."
  },
  {
    title: "حنانك",
    emoji: "🫂",
    text: "فيكي حته حنيه كده مختلفه اوي ."
  },
  {
    title: "وجودك",
    emoji: "💗",
    text: " بحب وجودك في حياتي، وإن مجرد كلامنا سوا ممكن يخلّي يومي أحلى حتي لو باخويه بس بيفرق معايا جامد."
  },
  {
    title: "إنك إنتِ",
    emoji: "💌",
    text: "بحبك عشان إنتِ إنتِ… من غير ما تحتاجي تغيّري أي حاجة في نفسك."
  },
  {
    title: "صراحتك",
    emoji: "🗝️",
    text: "اللي ف قلبك ع لسانك ع طول."
  },
  {
    title: "روحك الحلوة",
    emoji: "🎈",
    text: "بجد بحسك مختلفه اويييييي اويييييي ."
  },
  {
    title: "اختلافك",
    emoji: "🦢",
    text: "بحب إنك مختلفه هتقولي ازاي هقولك معرفش حاسك غير ."
  },
  {
    title: "كل حاجة فيكي",
    emoji: "💝",
    text: "ومهما كتبت، هيفضل فيه حاجات كتير بحبها فيكي ومش هتكفيها الكروت دي كلها."
  },
  {
    title: "وباكد تاني اهه حاجات بحبها م بحبك عشانها عشان عارفك حمار",
    emoji: "🪄",
    text: "بحبك بالله ي بت ."
  }
];

const cards = document.getElementById("cards");

reasons.forEach((reason, index) => {
  const button = document.createElement("button");
  button.className = "card";
  button.type = "button";
  button.innerHTML = `
    <div class="number">الكارت ${index + 1}</div>
    <div class="lock">🔒</div>
    <div class="hint">اضغطي عشان تفتحيه ♡</div>
  `;
  button.addEventListener("click", () => showCard(reason));
  cards.appendChild(button);
});

function showCard(reason) {
  document.getElementById("modalEmoji").textContent = reason.emoji;
  document.getElementById("modalTitle").textContent = reason.title;
  document.getElementById("modalText").textContent = reason.text;
  document.getElementById("overlay").classList.add("show");
}

function hideCard() {
  document.getElementById("overlay").classList.remove("show");
}

function closeCard(event) {
  if (event.target.id === "overlay") hideCard();
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") hideCard();
});
</script>
</body>
</html>
